<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="192" height="192">
  <rect width="100" height="100" rx="20" fill="#1a3a5c"/>
  <!-- Mosque dome -->
  <ellipse cx="50" cy="38" rx="22" ry="20" fill="#c8972a"/>
  <rect x="28" y="38" width="44" height="28" fill="#1a6496"/>
  <!-- Crescent -->
  <circle cx="50" cy="30" r="10" fill="#0d2a4a"/>
  <circle cx="55" cy="27" r="8" fill="#c8972a"/>
  <!-- Minaret left -->
  <rect x="20" y="30" width="8" height="36" fill="#c8972a" rx="2"/>
  <ellipse cx="24" cy="30" rx="4" ry="6" fill="#f0d080"/>
  <!-- Minaret right -->
  <rect x="72" y="30" width="8" height="36" fill="#c8972a" rx="2"/>
  <ellipse cx="76" cy="30" rx="4" ry="6" fill="#f0d080"/>
  <!-- Door -->
  <ellipse cx="50" cy="66" rx="8" ry="11" fill="#0a1830"/>
  <rect x="42" y="66" width="16" height="11" fill="#0a1830"/>
  <!-- Ground -->
  <rect x="10" y="66" width="80" height="4" rx="2" fill="#c8972a" opacity="0.6"/>
  <!-- Star and crescent small -->
  <text x="50" y="22" text-anchor="middle" font-size="10" fill="#0d2a4a">☽</text>
</svg>
